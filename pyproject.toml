[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PFERD"
description = "Programm zum Flotten Einfachen Runterladen von Dateien"
version = "3.9.4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "aiohttp>=3.8.1",
  "beautifulsoup4>=4.10.0",
  "rich>=11.0.0",
  "keyring>=23.5.0",
  "certifi>=2021.10.8"
]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/Garmelon/PFERD"
Issues = "https://github.com/Garmelon/PFERD/issues"

[project.scripts]
pferd = "PFERD.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "PFERD.version.VERSION"}

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
  "UP045",
  "SIM114",
  "B023"
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.1",
    "syrupy>=6.1.1",
]

[tool.pyrefly]
project-includes = ["PFERD", "pferd.py"]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The e2e tests mostly wait for ILIAS, so run them in parallel. Only tested with up to 8 workers.
addopts = ["-n", "auto", "--maxprocesses", "8"]
markers = [
    "e2e: end-to-end tests against a local ILIAS instance in docker (deselect with '-m \"not e2e\"')",
]
